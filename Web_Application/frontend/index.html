<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VERITAS — Fake News Detection</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --cyan:#00f5d4;
  --magenta:#f72585;
  --purple:#7209b7;
  --dark:#05050f;
  --dark2:#0a0a1a;
  --dark3:#0f0f25;
  --panel:#0d0d20;
  --border:#1a1a3a;
  --text:#c8c8e8;
  --dim:#555577;
  --white:#e8e8ff;
}
[data-theme="light"] {
  --cyan:#007a6a; --magenta:#c41560; --purple:#5a0096;
  --dark:#f0f2f8; --dark2:#e4e7f2; --dark3:#e8eaf5;
  --panel:#ffffff; --border:#c0c4d8; --text:#2a2a4a;
  --dim:#7a7a9a; --white:#1a1a3a;
  --scanline:rgba(0,0,0,0.0); --grid:rgba(0,90,80,0.04);
}
[data-theme="light"] body::before{background:none;}
html,body{height:100%;background:var(--dark);color:var(--text);font-family:'Rajdhani',sans-serif;overflow-x:hidden;}

/* SCANLINES */
body::before{
  content:'';position:fixed;top:0;left:0;width:100%;height:100%;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.08) 2px,rgba(0,0,0,0.08) 4px);
  pointer-events:none;z-index:9999;
}

/* GRID BG */
body::after{
  content:'';position:fixed;top:0;left:0;width:100%;height:100%;
  background-image:
    linear-gradient(rgba(0,245,212,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,245,212,0.03) 1px,transparent 1px);
  background-size:50px 50px;
  pointer-events:none;z-index:0;
}

.page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;}

/* HEADER */
.logo{text-align:center;margin-bottom:3rem;}
.logo-text{font-family:'Orbitron',monospace;font-size:3rem;font-weight:900;letter-spacing:0.3em;
  background:linear-gradient(135deg,var(--cyan),var(--magenta));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-shadow:none;position:relative;}
.logo-sub{font-family:'Share Tech Mono',monospace;font-size:0.7rem;letter-spacing:0.4em;color:var(--dim);margin-top:0.5rem;text-transform:uppercase;}
.logo-line{width:100%;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),var(--magenta),transparent);margin-top:1rem;}

/* GLITCH */
@keyframes glitch{
  0%,90%,100%{transform:translate(0);}
  92%{transform:translate(-2px,1px);filter:hue-rotate(90deg);}
  94%{transform:translate(2px,-1px);}
  96%{transform:translate(-1px,2px);filter:hue-rotate(-90deg);}
  98%{transform:translate(1px,-1px);}
}
.logo-text{animation:glitch 6s infinite;}

/* CARD */
.auth-card{
  width:100%;max-width:480px;
  background:var(--panel);
  border:1px solid var(--border);
  position:relative;
  clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,20px 100%,0 calc(100% - 20px));
}
.auth-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(0,245,212,0.05),transparent 50%,rgba(247,37,133,0.05));
  pointer-events:none;
}
.corner-tl,.corner-br{position:absolute;width:20px;height:20px;}
.corner-tl{top:-1px;left:-1px;border-top:2px solid var(--cyan);border-left:2px solid var(--cyan);}
.corner-br{bottom:-1px;right:-1px;border-bottom:2px solid var(--magenta);border-right:2px solid var(--magenta);}

.card-inner{padding:2.5rem;}

/* TABS */
.tabs{display:flex;margin-bottom:2rem;border-bottom:1px solid var(--border);}
.tab{flex:1;padding:0.75rem;text-align:center;font-family:'Orbitron',monospace;font-size:0.7rem;letter-spacing:0.15em;
  color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.3s;background:none;border-top:none;border-left:none;border-right:none;}
.tab.active{color:var(--cyan);border-bottom-color:var(--cyan);}
.tab:hover:not(.active){color:var(--text);}

/* FORMS */
.form-panel{display:none;}
.form-panel.active{display:block;}

.field{margin-bottom:1.5rem;}
.field label{display:block;font-family:'Share Tech Mono',monospace;font-size:0.7rem;letter-spacing:0.2em;color:var(--dim);margin-bottom:0.5rem;text-transform:uppercase;}
.field input{
  width:100%;padding:0.75rem 1rem;
  background:rgba(0,0,0,0.4);
  border:1px solid var(--border);
  color:var(--white);
  font-family:'Share Tech Mono',monospace;font-size:0.85rem;
  outline:none;transition:all 0.3s;
  clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%);
}
.field input:focus{border-color:var(--cyan);box-shadow:0 0 15px rgba(0,245,212,0.15);}
.field input::placeholder{color:var(--dim);}

/* BUTTON */
.btn-primary{
  width:100%;padding:1rem;
  background:transparent;
  border:1px solid var(--cyan);
  color:var(--cyan);
  font-family:'Orbitron',monospace;font-size:0.75rem;letter-spacing:0.2em;
  cursor:pointer;position:relative;overflow:hidden;transition:all 0.3s;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));
  text-transform:uppercase;
}
.btn-primary::before{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(0,245,212,0.1),transparent);
  transition:left 0.4s;
}
.btn-primary:hover::before{left:100%;}
.btn-primary:hover{background:rgba(0,245,212,0.1);box-shadow:0 0 20px rgba(0,245,212,0.2);}

/* DIVIDER */
.divider{display:flex;align-items:center;margin:1.5rem 0;gap:1rem;}
.divider span{font-family:'Share Tech Mono',monospace;font-size:0.7rem;color:var(--dim);}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}

/* GOOGLE BTN */
.btn-google{
  width:100%;padding:0.85rem;
  background:transparent;border:1px solid var(--border);
  color:var(--text);font-family:'Rajdhani',sans-serif;font-size:1rem;font-weight:500;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:0.75rem;
  transition:all 0.3s;
  clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px));
}
.btn-google:hover{border-color:var(--magenta);color:var(--white);background:rgba(247,37,133,0.05);}
.btn-google svg{width:18px;height:18px;}

/* STATUS */
.status-bar{
  display:flex;justify-content:space-between;align-items:center;
  padding:0.5rem 1rem;margin-top:2rem;
  border:1px solid var(--border);background:rgba(0,0,0,0.3);
  font-family:'Share Tech Mono',monospace;font-size:0.65rem;color:var(--dim);
}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);
  animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}

/* CORNER DECORATIONS */
.hud-corner{position:fixed;width:80px;height:80px;}
.hud-tl{top:1rem;left:1rem;border-top:1px solid var(--cyan);border-left:1px solid var(--cyan);}
.hud-tr{top:1rem;right:1rem;border-top:1px solid var(--magenta);border-right:1px solid var(--magenta);}
.hud-bl{bottom:1rem;left:1rem;border-bottom:1px solid var(--magenta);border-left:1px solid var(--magenta);}
.hud-br{bottom:1rem;right:1rem;border-bottom:1px solid var(--cyan);border-right:1px solid var(--cyan);}

.err{color:var(--magenta);font-family:'Share Tech Mono',monospace;font-size:0.72rem;margin-top:0.4rem;display:none;}
</style>
</head>
<body>
<div class="hud-tl hud-corner"></div>
<div class="hud-tr hud-corner"></div>
<div class="hud-bl hud-corner"></div>
<div class="hud-br hud-corner"></div>

<div class="page">
  <div class="logo">
    <button id="themeBtn" onclick="toggleTheme()" style="position:fixed;top:1rem;right:1rem;background:transparent;border:1px solid var(--cyan);color:var(--cyan);padding:0.4rem 0.8rem;font-family:'Share Tech Mono',monospace;font-size:0.7rem;cursor:pointer;z-index:9999;">☀ LIGHT</button>
    <div class="logo-text">VERITAS</div>
    <div class="logo-sub">Neural Fake News Detection System</div>
    <div class="logo-line"></div>
  </div>

  <div class="auth-card">
    <div class="corner-tl"></div>
    <div class="corner-br"></div>
    <div class="card-inner">
      <div class="tabs">
        <button class="tab active" onclick="switchTab('login')">LOGIN</button>
        <button class="tab" onclick="switchTab('signup')">REGISTER</button>
      </div>

      <!-- LOGIN -->
      <div class="form-panel active" id="login">
        <div class="field">
          <label>User Identifier</label>
          <input type="email" placeholder="user@domain.com" id="login-email">
        </div>
        <div class="field">
          <label>Access Key</label>
          <input type="password" placeholder="••••••••••••" id="login-pass">
        </div>
        <div class="err" id="login-err">⚠ Invalid credentials. Access denied.</div>
        <button class="btn-primary" onclick="handleLogin()">INITIALIZE SESSION</button>
        <div class="divider"><span>OR</span></div>
        <button class="btn-google" onclick="handleGoogle()">
          <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20H24v8h11.3C33.7 33.1 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 2.9l6-6C34.5 6.5 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 19.7-8 19.7-20 0-1.3-.1-2.7-.1-4z"/><path fill="#FF3D00" d="M6.3 14.7l7 5.1C15 16.1 19.2 13 24 13c3 0 5.8 1.1 7.9 2.9l6-6C34.5 6.5 29.5 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 10-1.8 13.7-4.7l-6.3-5.2C29.5 35.9 26.9 37 24 37c-5.2 0-9.6-3-11.3-7.3l-7 5.4C9.5 40.1 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20H24v8h11.3c-.8 2.3-2.3 4.3-4.3 5.8l6.3 5.2C41 35.6 44 30.2 44 24c0-1.3-.1-2.7-.4-4z"/></svg>
          Continue with Google
        </button>
      </div>

      <!-- SIGNUP -->
      <div class="form-panel" id="signup">
        <div class="field">
          <label>Username</label>
          <input type="text" placeholder="agent_username" id="reg-user">
        </div>
        <div class="field">
          <label>Email Address</label>
          <input type="email" placeholder="user@domain.com" id="reg-email">
        </div>
        <div class="field">
          <label>Access Key</label>
          <input type="password" placeholder="Min. 8 characters" id="reg-pass">
        </div>
        <div class="err" id="reg-err">⚠ Registration failed. Try again.</div>
        <button class="btn-primary" onclick="handleRegister()">CREATE ACCOUNT</button>
        <div class="divider"><span>OR</span></div>
        <button class="btn-google" onclick="handleGoogle()">
          <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20H24v8h11.3C33.7 33.1 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 2.9l6-6C34.5 6.5 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 19.7-8 19.7-20 0-1.3-.1-2.7-.1-4z"/><path fill="#FF3D00" d="M6.3 14.7l7 5.1C15 16.1 19.2 13 24 13c3 0 5.8 1.1 7.9 2.9l6-6C34.5 6.5 29.5 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 10-1.8 13.7-4.7l-6.3-5.2C29.5 35.9 26.9 37 24 37c-5.2 0-9.6-3-11.3-7.3l-7 5.4C9.5 40.1 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20H24v8h11.3c-.8 2.3-2.3 4.3-4.3 5.8l6.3 5.2C41 35.6 44 30.2 44 24c0-1.3-.1-2.7-.4-4z"/></svg>
          Continue with Google
        </button>
      </div>
    </div>
  </div>

  <div class="status-bar">
    <span><span class="status-dot" style="display:inline-block;margin-right:6px;"></span>SYSTEM ONLINE</span>
    <span>v2.4.1 — VERITAS ENGINE</span>
    <span>4 MODELS ACTIVE</span>
  </div>
</div>

<script>
// UI only — tab switching has no auth logic, safe to keep inline
function switchTab(tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.form-panel').forEach(p=>p.classList.remove('active'));
  document.querySelector(`#${tab}`).classList.add('active');
  event.target.classList.add('active');
}
</script>
<!-- Real Firebase auth logic lives in app.js -->
<script type="module" src="app.js"></script>
<script>
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('themeBtn').textContent = isDark ? '🌙 DARK' : '☀ LIGHT';
  localStorage.setItem('veritas-theme', isDark ? 'light' : 'dark');
}
(function applyTheme() {
  const saved = localStorage.getItem('veritas-theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  const btn = document.getElementById('themeBtn');
  if(btn) btn.textContent = saved === 'dark' ? '☀ LIGHT' : '🌙 DARK';
})();
</script>
</body>
</html>
